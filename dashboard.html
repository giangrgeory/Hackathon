<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kita - Kita</title>
    <link rel="stylesheet" href="/priority-colors.css">
    <style>
        :root {
            --page-deep: #0b3038;
            --surface: rgba(8, 48, 55, 0.9);
            --surface-soft: rgba(13, 67, 70, 0.82);
            --surface-dark: rgba(5, 34, 40, 0.86);
            --line: rgba(194, 235, 215, 0.26);
            --text: #eaf7f1;
            --muted: #c1ddd3;
            --mint: #a9e6c4;
            --amber: #f5d58a;
            --amber-strong: #e9bd5c;
            --panel: rgba(255,255,255,0.04);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: linear-gradient(90deg, rgba(26, 86, 110, 1) 0%, rgba(36, 128, 91, 1) 50%, rgba(26, 86, 110, 1) 100%);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 7vw;
            background: rgba(5, 34, 40, 0.92);
            border-bottom: 1px solid var(--line);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font: 700 24px Georgia, serif;
            color: var(--text);
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .logo img {
            width: 38px;
            height: 38px;
            object-fit: cover;
            border-radius: 8px;
        }

        .logo span {
            color: var(--mint);
        }

        nav a {
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }

        nav a:hover {
            color: var(--mint);
        }

        main {
            max-width: 1080px;
            margin: auto;
            padding: 7vh 7vw 10vh;
        }

        .heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--amber);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 {
            margin: 12px 0 8px;
            font: 700 clamp(40px, 6vw, 66px)/1 Georgia, serif;
            letter-spacing: -2px;
            color: var(--amber);
        }

        .heading p {
            margin: 0;
            color: var(--muted);
        }

        button {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        button:hover {
            background: var(--mint);
            color: var(--page-deep);
            transform: translateY(-1px);
        }

        .summary {
            display: flex;
            gap: 1px;
            margin-bottom: 16px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
        }

        .summary-item {
            flex: 1;
            padding: 22px;
            background: var(--surface-soft);
        }

        .summary-label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 9px;
        }

        .summary-value {
            font: 700 34px Georgia, serif;
            color: var(--amber);
        }

        .list {
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255,255,255,0.04);
        }

        .empty {
            padding: 40px 22px;
            color: var(--muted);
            text-align: center;
        }

        .row {
            display: grid;
            grid-template-columns: minmax(0,1fr) auto auto auto;
            gap: 22px;
            align-items: center;
            padding: 21px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .row:last-child {
            border-bottom: none;
        }

        .title {
            margin-bottom: 7px;
            font-weight: 700;
            color: var(--text);
        }

        .meta {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .status {
            padding: 6px 10px;
            background: rgba(169, 230, 196, 0.12);
            border: 1px solid rgba(169, 230, 196, 0.4);
            border-radius: 999px;
            color: var(--mint);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .time {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        @media (max-width: 700px) {
            nav { padding: 18px 20px; }
            main { padding: 44px 20px; }
            .heading { align-items: start; flex-direction: column; }
            .summary { display: block; }
            .summary-item + .summary-item { border-top: 1px solid var(--line); }
            .row { grid-template-columns: 1fr; gap: 10px; }
            .time { white-space: normal; }
        }
    </style>
</head>
<body>
    <nav><a class="logo" href="/" aria-label="Kita - Kita home"><img src="/logo.png" alt="">Kita - Kita</a><a href="/">Back to home</a></nav>
    <main>
        <div class="heading"><div><div class="eyebrow">Community response desk</div><h1>Open reports</h1><p>See current community reports and their status.</p></div></div>
        <div class="summary"><div class="summary-item"><span class="summary-label">Open reports</span><span class="summary-value" id="count">0</span></div><div class="summary-item"><span class="summary-label">Last refreshed</span><span class="summary-value" id="updated">now</span></div></div>
        <div class="list" id="list"><div class="empty">Loading reports...</div></div>
    </main>
    <script>
        const list = document.getElementById("list");
        const count = document.getElementById("count");
        const updated = document.getElementById("updated");

        function time(createdAt) { const minutes = Math.max(0, Math.floor((Date.now() - new Date(createdAt).getTime()) / 60000)); return minutes < 1 ? "just now" : minutes < 60 ? `${minutes} min ago` : `${Math.floor(minutes / 60)} hr ago`; }

        async function loadReports() {
            try {
                const response = await fetch("/api/reports");
                if (!response.ok) throw new Error();
                const reports = (await response.json()).filter(report => report.status === "Pending");
                count.textContent = reports.length;
                updated.textContent = "now";
                list.replaceChildren();
                if (!reports.length) {
                    const empty = document.createElement("div");
                    empty.className = "empty";
                    empty.textContent = "No open reports yet.";
                    list.append(empty);
                    return;
                }
                reports.forEach(report => {
                    const row = document.createElement("div");
                    row.className = "row";
                    row.innerHTML = `<div><div class="title"></div><div class="meta"></div></div><span class="priority-tag"></span><span class="status"></span><span class="time"></span>`;
                    row.querySelector(".title").textContent = report.title;
                    const category = report.category === "Other" && report.details ? `Others: ${report.details}` : report.category || "Other";
                    row.querySelector(".meta").textContent = `${category} - Submitted by ${report.name || "Unknown"}`;
                    const priority = ["high", "medium", "low"].includes(report.priority)
                        ? report.priority
                        : "medium";
                    const priorityTag = row.querySelector(".priority-tag");
                    priorityTag.dataset.priority = priority;
                    priorityTag.textContent = `${priority[0].toUpperCase()}${priority.slice(1)} priority`;
                    row.querySelector(".status").textContent = report.status;
                    row.querySelector(".time").textContent = time(report.createdAt);
                    list.append(row);
                });
            } catch (error) {
                list.innerHTML = '<div class="empty">Reports are unavailable. Check that the server is running.</div>';
            }
        }

        loadReports();
    </script>
</body>
</html>
