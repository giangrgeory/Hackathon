<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Kita - Kita</title>
    <link rel="stylesheet" href="/priority-colors.css">
    <style>
        :root {
            --page-deep: #0b3038;
            --surface: rgba(8, 48, 55, 0.92);
            --surface-soft: rgba(13, 67, 70, 0.86);
            --line: rgba(194, 235, 215, 0.26);
            --text: #eaf7f1;
            --muted: #c1ddd3;
            --mint: #a9e6c4;
            --amber: #f5d58a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: linear-gradient(90deg, #1a566e 0%, #24805b 50%, #1a566e 100%);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 7vw;
            background: rgba(5, 34, 40, 0.94);
            border-bottom: 1px solid var(--line);
        }

        nav a { color: var(--muted); font-size: 13px; text-decoration: none; }
        nav a:hover { color: var(--mint); }
        .brand { color: var(--text); font: 700 22px Georgia, serif; }

        main { max-width: 1080px; margin: auto; padding: 7vh 7vw 10vh; }
        .eyebrow { color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: 2px; }

        h1 {
            margin: 12px 0 8px;
            color: var(--amber);
            font: 700 clamp(38px, 6vw, 60px)/1 Georgia, serif;
        }

        .intro { margin: 0; color: var(--muted); }
        .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }

        button, input {
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 7px;
            font: inherit;
        }

        button {
            padding: 9px 14px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        button:hover { background: var(--mint); color: var(--page-deep); }
        button:disabled { cursor: wait; opacity: 0.65; }

        .access-panel, .list {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
        }

        .access-panel { max-width: 460px; padding: 24px; }
        .access-panel h2 { margin: 0 0 18px; font: 700 22px Georgia, serif; color: var(--amber); }
        label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 13px; }

        .login-fields { display: flex; gap: 10px; }
        input { width: 100%; padding: 9px 12px; background: rgba(5, 34, 40, 0.7); color: var(--text); }
        input:focus { outline: 2px solid var(--mint); outline-offset: 2px; }
        .message { min-height: 20px; margin: 12px 0 0; color: var(--amber); font-size: 13px; }

        .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-bottom: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--line); }
        .summary-item { padding: 18px 20px; background: var(--surface-soft); }
        .summary-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
        .summary-value { color: var(--amber); font: 700 30px Georgia, serif; }
        .list { overflow: hidden; }
        .empty { padding: 32px 20px; color: var(--muted); text-align: center; }

        .report-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto auto auto;
            align-items: center;
            gap: 18px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
        }

        .report-row:last-child { border-bottom: 0; }
        .report-title { margin-bottom: 6px; font-weight: 700; }
        .report-meta, .report-time { color: var(--muted); font-size: 12px; line-height: 1.5; }
        .report-status { color: var(--mint); font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .actions { display: flex; gap: 10px; justify-content: flex-end; margin: 0 0 16px; }

        [hidden] { display: none !important; }

        @media (max-width: 700px) {
            nav { padding: 16px 20px; }
            main { padding: 42px 20px; }
            .heading { align-items: start; flex-direction: column; }
            .summary { grid-template-columns: 1fr; }
            .summary-item + .summary-item { border-top: 1px solid var(--line); }
            .report-row { grid-template-columns: 1fr; gap: 8px; }
            .actions { justify-content: start; }
            .login-fields { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="/">Kita - Kita Admin</a>
        <a href="/dashboard">Public dashboard</a>
    </nav>
    <main>
        <div class="heading">
            <div>
                <div class="eyebrow">Private management</div>
                <h1>Report administration</h1>
                <p class="intro">Review reports and update their status.</p>
            </div>
            <button type="button" id="signOutButton" hidden>Sign out</button>
        </div>

        <section class="access-panel" id="loginPanel" aria-labelledby="loginHeading">
            <h2 id="loginHeading">Admin sign in</h2>
            <form id="loginForm">
                <label for="adminKey">Admin key</label>
                <div class="login-fields">
                    <input id="adminKey" name="adminKey" type="password" autocomplete="current-password" required>
                    <button type="submit" id="signInButton">Sign in</button>
                </div>
                <p class="message" id="loginMessage" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section id="adminPanel" hidden aria-label="Report controls">
            <div class="summary">
                <div class="summary-item"><span class="summary-label">All reports</span><span class="summary-value" id="totalCount">0</span></div>
                <div class="summary-item"><span class="summary-label">Pending</span><span class="summary-value" id="pendingCount">0</span></div>
                <div class="summary-item"><span class="summary-label">Resolved</span><span class="summary-value" id="resolvedCount">0</span></div>
            </div>
            <div class="actions"><button type="button" id="refreshButton">Refresh reports</button><button type="button" id="clearButton">Clear all reports</button></div>
            <div class="list" id="reportList" aria-live="polite"><div class="empty">Loading reports...</div></div>
            <p class="message" id="adminMessage" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script>
        const storageKey = "civicsight-admin-key";
        const loginForm = document.getElementById("loginForm");
        const loginPanel = document.getElementById("loginPanel");
        const loginMessage = document.getElementById("loginMessage");
        const adminPanel = document.getElementById("adminPanel");
        const adminMessage = document.getElementById("adminMessage");
        const reportList = document.getElementById("reportList");
        const signOutButton = document.getElementById("signOutButton");

        function showAdmin(isSignedIn) {
            loginPanel.hidden = isSignedIn;
            adminPanel.hidden = !isSignedIn;
            signOutButton.hidden = !isSignedIn;
        }

        function withAdminHeaders() {
            return { "X-Admin-Key": sessionStorage.getItem(storageKey) || "" };
        }

        async function verifyAdminKey(key) {
            const response = await fetch("/api/admin/verify", {
                headers: { "X-Admin-Key": key }
            });
            if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload.error || "Admin sign in failed.");
            }
        }

        function time(createdAt) {
            const minutes = Math.max(0, Math.floor((Date.now() - new Date(createdAt).getTime()) / 60000));
            return minutes < 1 ? "just now" : minutes < 60 ? `${minutes} min ago` : `${Math.floor(minutes / 60)} hr ago`;
        }

        function showListMessage(message) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = message;
            reportList.replaceChildren(empty);
        }

        async function loadReports() {
            adminMessage.textContent = "";
            try {
                const response = await fetch("/api/reports");
                if (!response.ok) throw new Error("Reports could not be loaded.");
                const reports = await response.json();
                const pending = reports.filter(report => report.status === "Pending");
                const resolved = reports.filter(report => report.status === "Resolved");
                document.getElementById("totalCount").textContent = reports.length;
                document.getElementById("pendingCount").textContent = pending.length;
                document.getElementById("resolvedCount").textContent = resolved.length;
                reportList.replaceChildren();

                if (!reports.length) {
                    showListMessage("No reports have been submitted yet.");
                    return;
                }

                reports.forEach(report => {
                    const row = document.createElement("article");
                    row.className = "report-row";
                    const details = document.createElement("div");
                    const title = document.createElement("div");
                    title.className = "report-title";
                    title.textContent = report.title || "Untitled report";
                    const meta = document.createElement("div");
                    meta.className = "report-meta";
                    const category = report.category === "Other" && report.details
                        ? `Others: ${report.details}`
                        : report.category || "Other";
                    meta.textContent = `${category} - Submitted by ${report.name || "Unknown"}`;
                    details.append(title, meta);

                    const priority = ["high", "medium", "low"].includes(report.priority)
                        ? report.priority
                        : "medium";
                    const prioritySelect = document.createElement("select");
                    prioritySelect.className = "priority-select";
                    prioritySelect.dataset.priority = priority;
                    prioritySelect.setAttribute("aria-label", `Priority for ${report.title || "report"}`);
                    ["high", "medium", "low"].forEach(value => {
                        const option = document.createElement("option");
                        option.value = value;
                        option.textContent = `${value[0].toUpperCase()}${value.slice(1)}`;
                        prioritySelect.append(option);
                    });
                    prioritySelect.value = priority;
                    prioritySelect.addEventListener("change", () =>
                        updatePriority(report.id, prioritySelect, priority)
                    );

                    const status = document.createElement("span");
                    status.className = "report-status";
                    status.textContent = report.status || "Pending";
                    const submitted = document.createElement("span");
                    submitted.className = "report-time";
                    submitted.textContent = time(report.createdAt);
                    row.append(details, prioritySelect, status, submitted);

                    if (report.status === "Pending") {
                        const resolveButton = document.createElement("button");
                        resolveButton.type = "button";
                        resolveButton.textContent = "Mark resolved";
                        resolveButton.addEventListener("click", () => resolveReport(report.id));
                        row.append(resolveButton);
                    }
                    reportList.append(row);
                });
            } catch (error) {
                showListMessage(error.message || "Reports are unavailable.");
            }
        }

        async function updatePriority(id, select, previousPriority) {
            const nextPriority = select.value;
            select.dataset.priority = nextPriority;
            select.disabled = true;
            adminMessage.textContent = "";
            try {
                const response = await fetch(`/api/reports/${encodeURIComponent(id)}/priority`, {
                    method: "PATCH",
                    headers: {
                        ...withAdminHeaders(),
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ priority: nextPriority })
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    select.value = previousPriority;
                    select.dataset.priority = previousPriority;
                    adminMessage.textContent = payload.error || "Could not update priority.";
                    if (response.status === 401 || response.status === 403) signOut();
                    return;
                }
                await loadReports();
            } catch (error) {
                select.value = previousPriority;
                select.dataset.priority = previousPriority;
                adminMessage.textContent = error.message || "Could not update priority.";
            } finally {
                select.disabled = false;
            }
        }

        async function resolveReport(id) {
            const response = await fetch(`/api/reports/${encodeURIComponent(id)}/resolve`, {
                method: "PATCH",
                headers: withAdminHeaders()
            });
            if (response.ok) {
                await loadReports();
                return;
            }
            const payload = await response.json().catch(() => ({}));
            adminMessage.textContent = payload.error || "Could not update this report.";
            if (response.status === 401 || response.status === 403) signOut();
        }

        function signOut() {
            sessionStorage.removeItem(storageKey);
            showAdmin(false);
            loginMessage.textContent = "You have been signed out.";
        }

        loginForm.addEventListener("submit", async event => {
            event.preventDefault();
            const button = document.getElementById("signInButton");
            const key = document.getElementById("adminKey").value;
            button.disabled = true;
            loginMessage.textContent = "Checking admin key...";
            try {
                await verifyAdminKey(key);
                sessionStorage.setItem(storageKey, key);
                document.getElementById("adminKey").value = "";
                showAdmin(true);
                await loadReports();
            } catch (error) {
                loginMessage.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });

        signOutButton.addEventListener("click", signOut);
        document.getElementById("refreshButton").addEventListener("click", loadReports);
        document.getElementById("clearButton").addEventListener("click", async () => {
            if (!confirm("Permanently clear all reports? This cannot be undone.")) return;
            const response = await fetch("/api/reports", {
                method: "DELETE",
                headers: withAdminHeaders()
            });
            if (response.ok) await loadReports();
            else {
                const payload = await response.json().catch(() => ({}));
                adminMessage.textContent = payload.error || "Could not clear reports.";
                if (response.status === 401 || response.status === 403) signOut();
            }
        });

        const savedKey = sessionStorage.getItem(storageKey);
        if (savedKey) {
            verifyAdminKey(savedKey)
                .then(() => {
                    showAdmin(true);
                    loadReports();
                })
                .catch(() => {
                    sessionStorage.removeItem(storageKey);
                    showAdmin(false);
                });
        } else {
            showAdmin(false);
        }
    </script>
</body>
</html>
